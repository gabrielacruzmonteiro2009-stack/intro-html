<!-- DOCTYPE -- serve para para indicar para os navegadores qual a versão e qual padrão do HTML está sendo usado -->  
<!DOCTYPE html>

<!-- HTML- Elementos raiz. Tudo que pertecem ao documento HTML fica dentro dele-->

<!-- LANG/language(indioma) = Atributo responsável pela linguagem do conteúdo do site. Além disso, tem um impacto muito grande na acesibilidade e SEO-->
<html lang="pt-br"
    

<head>
  
   <!-- charset= essa configuração serve para indicar ao navegador qual padrão/condificação de caracteres usar. Isso permite, utilizar palavras com acentos, caracteres especiais e emojis.-->
    <meta charset="UTF-8">
  
 
 
 
    <!-- title/título = Representa o título que aparece na aba do navegador do usuário. -->
 <title> Olá, Mundo </title>
</head>

<!-- body/corpo - conteúdo visivel da página onde o usuário interage e consome recursos da página. Por exemplo: textos, imagens, vídeos, botões e links. -->
<body>
    Hello, world! Este é o meu primeiro programa em HTML.</p>
</body>
</html>
